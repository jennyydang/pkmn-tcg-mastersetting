<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- back cards -->
  <rect x="300" y="250" width="380" height="530" rx="36" fill="#93c5fd" transform="rotate(-14 490 515)"/>
  <rect x="330" y="240" width="380" height="530" rx="36" fill="#dbeafe" transform="rotate(-5 520 505)"/>
  <!-- front card -->
  <g transform="rotate(6 540 520)">
    <rect x="352" y="250" width="380" height="530" rx="36" fill="url(#card)"/>
    <rect x="384" y="282" width="316" height="250" rx="20" fill="#fbbf24"/>
    <rect x="384" y="560" width="230" height="28" rx="14" fill="#cbd5e1"/>
    <rect x="384" y="608" width="170" height="28" rx="14" fill="#cbd5e1"/>
  </g>
  <!-- checkmark badge -->
  <circle cx="712" cy="742" r="150" fill="#16a34a" stroke="#ffffff" stroke-width="28"/>
  <path d="M640 742 l50 52 l98 -110" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
